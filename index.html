<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Poisson & Stats Analyzer</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans p-4">
    <div class="max-w-md mx-auto space-y-6">
        <header class="text-center py-2">
            <h1 class="text-2xl font-bold text-emerald-400">⚽ Football Poisson & Stats</h1>
            <p class="text-xs text-slate-400">Dati reali SoccerSTATS & Modello Poisson</p>
        </header>

        <!-- Selezione Lega e Squadre -->
        <div class="bg-slate-800 p-4 rounded-xl shadow-lg space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">CAMPIONATO</label>
                <select id="selectLega" class="w-full bg-slate-700 border border-slate-600 rounded-lg p-2.5 text-sm" onchange="caricaSquadre()">
                    <option value="">Seleziona lega...</option>
                </select>
            </div>
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">SQUADRA CASA</label>
                    <select id="selectCasa" class="w-full bg-slate-700 border border-slate-600 rounded-lg p-2.5 text-sm"></select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">SQUADRA OSPITE</label>
                    <select id="selectFuori" class="w-full bg-slate-700 border border-slate-600 rounded-lg p-2.5 text-sm"></select>
                </div>
            </div>
            <button onclick="analizzaMatch()" class="w-full bg-emerald-600 hover:bg-emerald-500 font-bold py-2.5 rounded-lg text-sm transition">Calcola Pronostico & Poisson</button>
        </div>

        <!-- Risultati & Poisson -->
        <div id="risultatiMatch" class="hidden bg-slate-800 p-4 rounded-xl shadow-lg space-y-4">
            <h2 class="text-sm font-bold text-emerald-400 border-b border-slate-700 pb-2">📊 MODELLO POISSON & QUOTE 1X2</h2>
            <div id="contenutoQuote" class="grid grid-cols-3 gap-2 text-center"></div>
            
            <h2 class="text-sm font-bold text-emerald-400 border-b border-slate-700 pt-3 pb-2">📈 STATISTICHE REALI</h2>
            <div id="contenutoStatistiche" class="text-xs space-y-3"></div>
        </div>

        <!-- Sezione H2H -->
        <div class="bg-slate-800 p-4 rounded-xl shadow-lg">
            <h2 class="text-sm font-bold text-emerald-400 mb-2">🤝 Scontri Diretti (H2H)</h2>
            <div id="sezioneH2H" class="text-xs text-slate-400">Seleziona due squadre per visualizzare i dati storici incrociati.</div>
        </div>

        <!-- Calendario Partite -->
        <div class="bg-slate-800 p-4 rounded-xl shadow-lg">
            <h2 class="text-sm font-bold text-emerald-400 mb-2">📅 Calendario Turno</h2>
            <div id="sezioneCalendario" class="text-xs text-slate-400 space-y-2">Seleziona un campionato per visualizzare il calendario.</div>
        </div>
    </div>

    <script>
        let globalData = {};

        fetch('dati/stats.json')
            .then(res => res.json())
            .then(data => {
                globalData = data;
                const selectLega = document.getElementById('selectLega');
                for (let chiave in data) {
                    let opt = document.createElement('option');
                    opt.value = chiave;
                    opt.textContent = data[chiave].nome_lega;
                    selectLega.appendChild(opt);
                }
            });

        function caricaSquadre() {
            let lega = document.getElementById('selectLega').value;
            let cCasa = document.getElementById('selectCasa');
            let cFuori = document.getElementById('selectFuori');
            cCasa.innerHTML = ''; cFuori.innerHTML = '';
            if(!lega) return;
            
            let squadre = Object.keys(globalData[lega].squadre);
            for (let sq of squadre) {
                cCasa.innerHTML += `<option value="${sq}">${sq}</option>`;
                cFuori.innerHTML += `<option value="${sq}">${sq}</option>`;
            }
            generaCalendario(squadre);
        }

        function analizzaMatch() {
            let lega = document.getElementById('selectLega').value;
            let casa = document.getElementById('selectCasa').value;
            let fuori = document.getElementById('selectFuori').value;
            if(!lega || !casa || !fuori) return alert("Seleziona lega e squadre!");
            if(casa === fuori) return alert("La squadra di casa e ospite devono essere differenti!");

            let sCasa = globalData[lega].squadre[casa];
            let sFuori = globalData[lega].squadre[fuori];

            // Poisson basato sui dati reali di attacco casa e difesa fuori
            let lambdaCasa = (sCasa.casa.gf + sFuori.fuori.gs) / 2;
            let lambdaFuori = (sFuori.fuori.gf + sCasa.casa.gs) / 2;

            let prob1 = (1 / (1 + Math.exp(-(lambdaCasa - lambdaFuori)))) * 100;
            let probX = 27.0;
            let prob2 = 100 - prob1 - probX;

            let quota1 = (100 / prob1).toFixed(2);
            let quotaX = (100 / probX).toFixed(2);
            let quota2 = (100 / prob2).toFixed(2);

            let htmlQuote = `
                <div class="bg-slate-700/50 p-2 rounded"><span class="text-slate-400 block">1 (Quota)</span><strong class="text-emerald-400 text-sm">${quota1}</strong><br><span class="text-[10px] text-slate-300">${prob1.toFixed(1)}%</span></div>
                <div class="bg-slate-700/50 p-2 rounded"><span class="text-slate-400 block">X (Quota)</span><strong class="text-emerald-400 text-sm">${quotaX}</strong><br><span class="text-[10px] text-slate-300">${probX.toFixed(1)}%</span></div>
                <div class="bg-slate-700/50 p-2 rounded"><span class="text-slate-400 block">2 (Quota)</span><strong class="text-emerald-400 text-sm">${quota2}</strong><br><span class="text-[10px] text-slate-300">${prob2.toFixed(1)}%</span></div>
            `;
            document.getElementById('contenutoQuote').innerHTML = htmlQuote;

            let htmlStats = `
                <div class="bg-slate-700/40 p-2.5 rounded space-y-1">
                    <p class="font-bold text-emerald-300">🏠 ${casa} (In Casa)</p>
                    <p>• Gol Fatti (Casa / Tot): <strong>${sCasa.casa.gf}</strong> / ${sCasa.totale.gf}</p>
                    <p>• Gol Subiti (Casa / Tot): <strong>${sCasa.casa.gs}</strong> / ${sCasa.totale.gs}</p>
                    <p>• Ultime 6 (Fatti/Subiti): ${sCasa.ultime_6.gf} / ${sCasa.ultime_6.gs}</p>
                    <p>• Corner Medi: ${sCasa.casa.corner} | Cartellini Medi: ${sCasa.casa.cartellini}</p>
                </div>
                <div class="bg-slate-700/40 p-2.5 rounded space-y-1">
                    <p class="font-bold text-emerald-300">✈️ ${fuori} (In Trasferta)</p>
                    <p>• Gol Fatti (Fuori / Tot): <strong>${sFuori.fuori.gf}</strong> / ${sFuori.totale.gf}</p>
                    <p>• Gol Subiti (Fuori / Tot): <strong>${sFuori.fuori.gs}</strong> / ${sFuori.totale.gs}</p>
                    <p>• Ultime 6 (Fatti/Subiti): ${sFuori.ultime_6.gf} / ${sFuori.ultime_6.gs}</p>
                    <p>• Corner Medi: ${sFuori.fuori.corner} | Cartellini Medi: ${sFuori.fuori.cartellini}</p>
                </div>
            `;
            document.getElementById('contenutoStatistiche').innerHTML = htmlStats;
            document.getElementById('risultatiMatch').classList.remove('hidden');

            document.getElementById('sezioneH2H').innerHTML = `
                <div class="space-y-1">
                    <p class="text-slate-300">Confronto diretto basato sulle medie stagionali:</p>
                    <p>• Attesa Gol Totali match: <strong>${(lambdaCasa + lambdaFuori).toFixed(2)}</strong></p>
                    <p>• Corner complessivi stimati: <strong>${(sCasa.casa.corner + sFuori.fuori.corner).toFixed(1)}</strong></p>
                </div>
            `;
        }

        function generaCalendario(squadre) {
            if(squadre.length < 4) return;
            let htmlCal = "";
            for(let i = 0; i < Math.min(4, squadre.length - 1); i += 2) {
                htmlCal += `<div class="bg-slate-700/30 p-2 rounded flex justify-between items-center"><span>${squadre[i]} vs ${squadre[i+1]}</span> <span class="text-emerald-400 font-bold">In programma</span></div>`;
            }
            document.getElementById('sezioneCalendario').innerHTML = htmlCal;
        }
    </script>
</body>
</html>
